<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Background -->
  <rect width="400" height="400" rx="20" fill="#FFFFFF"/>
  
  <!-- Wall clock -->
  <circle cx="320" cy="100" r="45" fill="#FFB627"/>
  <circle cx="320" cy="100" r="38" fill="#FFD166"/>
  <line x1="320" y1="100" x2="320" y2="75" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>
  <line x1="320" y1="100" x2="340" y2="100" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="320" cy="100" r="4" fill="#2D2D2D"/>
  <!-- Clock numbers -->
  <text x="320" y="68" text-anchor="middle" fill="#2D2D2D" font-size="10" font-weight="bold">12</text>
  <text x="350" y="104" text-anchor="middle" fill="#2D2D2D" font-size="10" font-weight="bold">3</text>
  <text x="320" y="140" text-anchor="middle" fill="#2D2D2D" font-size="10" font-weight="bold">6</text>
  <text x="290" y="104" text-anchor="middle" fill="#2D2D2D" font-size="10" font-weight="bold">9</text>
  
  <!-- Desk -->
  <rect x="60" y="290" width="280" height="15" rx="6" fill="#E85D04"/>
  <rect x="80" y="305" width="20" height="60" fill="#C44B03"/>
  <rect x="300" y="305" width="20" height="60" fill="#C44B03"/>
  
  <!-- Monitor -->
  <rect x="140" y="170" width="140" height="100" rx="8" fill="#2D2D2D"/>
  <rect x="145" y="175" width="130" height="90" rx="4" fill="#3A3A3A"/>
  <!-- Monitor stand -->
  <rect x="200" y="270" width="20" height="25" fill="#2D2D2D"/>
  <rect x="185" y="290" width="50" height="5" rx="2" fill="#2D2D2D"/>
  
  <!-- Screen content -->
  <rect x="155" y="185" width="50" height="6" rx="2" fill="#E85D04"/>
  <rect x="155" y="197" width="110" height="4" rx="1" fill="#4A4A4A"/>
  <rect x="155" y="207" width="90" height="4" rx="1" fill="#4A4A4A"/>
  <rect x="155" y="220" width="45" height="35" rx="4" fill="#FFB627"/>
  <rect x="210" y="220" width="45" height="35" rx="4" fill="#E85D04"/>
  
  <!-- Person - Woman sitting -->
  <!-- Chair -->
  <path d="M100 250 Q100 320 180 320 Q260 320 260 250" fill="#4A4A4A"/>
  
  <!-- Body/Shirt -->
  <path d="M140 200 Q130 250 140 290 L220 290 Q230 250 220 200 Z" fill="#FFB627"/>
  
  <!-- Arms on desk -->
  <path d="M135 220 Q100 260 90 280" stroke="#FFD4A8" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M225 220 Q260 260 270 280" stroke="#FFD4A8" stroke-width="18" stroke-linecap="round" fill="none"/>
  
  <!-- Hands -->
  <ellipse cx="85" cy="282" rx="12" ry="8" fill="#FFD4A8"/>
  <ellipse cx="275" cy="282" rx="12" ry="8" fill="#FFD4A8"/>
  
  <!-- Head -->
  <circle cx="180" cy="150" r="42" fill="#FFD4A8"/>
  
  <!-- Hair -->
  <ellipse cx="180" cy="128" rx="48" ry="32" fill="#2D2D2D"/>
  <ellipse cx="140" cy="148" rx="16" ry="28" fill="#2D2D2D"/>
  <ellipse cx="220" cy="148" rx="16" ry="28" fill="#2D2D2D"/>
  <!-- Hair shine -->
  <path d="M155 108 Q180 95 205 108" stroke="#4A4A4A" stroke-width="4" fill="none"/>
  
  <!-- Face -->
  <circle cx="165" cy="148" r="4" fill="#2D2D2D"/>
  <circle cx="195" cy="148" r="4" fill="#2D2D2D"/>
  <circle cx="167" cy="146" r="1.5" fill="white"/>
  <circle cx="197" cy="146" r="1.5" fill="white"/>
  <path d="M170 168 Q180 176 190 168" stroke="#2D2D2D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="155" cy="162" rx="8" ry="5" fill="#FFB6B6" opacity="0.4"/>
  <ellipse cx="205" cy="162" rx="8" ry="5" fill="#FFB6B6" opacity="0.4"/>
  
  <!-- Coffee cup -->
  <rect x="320" y="268" width="22" height="22" rx="4" fill="#FFFFFF"/>
  <rect x="324" y="262" width="14" height="8" rx="2" fill="#E85D04"/>
  <path d="M342 274 Q352 274 352 284 Q352 294 342 294" stroke="#FFFFFF" stroke-width="3" fill="none"/>
  
  <!-- Plant -->
  <rect x="65" y="265" width="18" height="28" rx="4" fill="#4CAF50"/>
  <ellipse cx="74" cy="258" rx="18" ry="14" fill="#66BB6A"/>
  <ellipse cx="60" cy="262" rx="10" ry="8" fill="#81C784"/>
  <ellipse cx="88" cy="262" rx="10" ry="8" fill="#81C784"/>
  
  <!-- Decorative -->
  <rect x="50" y="80" width="25" height="25" rx="5" fill="#FFB627" opacity="0.3" transform="rotate(20 62 92)"/>
  <circle cx="370" cy="300" r="5" fill="#E85D04" opacity="0.4"/>
</svg>