<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Background -->
  <rect width="400" height="400" rx="20" fill="#F5F5F5"/>
  
  <!-- Desk surface -->
  <ellipse cx="200" cy="340" rx="160" ry="30" fill="#E0E0E0"/>
  
  <!-- Person - Woman sitting cross-legged -->
  <!-- Legs -->
  <path d="M140 280 Q120 320 160 330 Q180 335 180 310" fill="#2D2D2D" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M220 280 Q240 320 200 330 Q180 335 180 310" fill="#2D2D2D" stroke="#1A1A1A" stroke-width="2"/>
  
  <!-- Body/Shirt -->
  <path d="M140 200 Q130 240 140 280 L220 280 Q230 240 220 200 Z" fill="#FFB627"/>
  
  <!-- Arms -->
  <path d="M140 210 Q120 240 130 270" stroke="#FFD4A8" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M220 210 Q240 240 230 270" stroke="#FFD4A8" stroke-width="20" stroke-linecap="round" fill="none"/>
  
  <!-- Hands on laptop -->
  <ellipse cx="150" cy="275" rx="12" ry="8" fill="#FFD4A8"/>
  <ellipse cx="210" cy="275" rx="12" ry="8" fill="#FFD4A8"/>
  
  <!-- Laptop -->
  <rect x="130" y="260" width="100" height="65" rx="4" fill="#3A3A3A"/>
  <rect x="135" y="265" width="90" height="50" rx="2" fill="#4A4A4A"/>
  <!-- Screen content -->
  <rect x="145" y="275" width="40" height="5" rx="2" fill="#E85D04"/>
  <rect x="145" y="285" width="70" height="3" rx="1" fill="#666"/>
  <rect x="145" y="293" width="55" height="3" rx="1" fill="#666"/>
  <rect x="145" y="301" width="65" height="3" rx="1" fill="#666"/>
  
  <!-- Head -->
  <circle cx="180" cy="150" r="45" fill="#FFD4A8"/>
  
  <!-- Hair -->
  <ellipse cx="180" cy="130" rx="50" ry="35" fill="#2D2D2D"/>
  <ellipse cx="140" cy="150" rx="18" ry="30" fill="#2D2D2D"/>
  <ellipse cx="220" cy="150" rx="18" ry="30" fill="#2D2D2D"/>
  <!-- Hair highlights -->
  <path d="M160 110 Q180 95 200 110" stroke="#4A4A4A" stroke-width="3" fill="none"/>
  
  <!-- Face -->
  <circle cx="165" cy="150" r="4" fill="#2D2D2D"/>
  <circle cx="195" cy="150" r="4" fill="#2D2D2D"/>
  <!-- Eyes shine -->
  <circle cx="167" cy="148" r="1.5" fill="white"/>
  <circle cx="197" cy="148" r="1.5" fill="white"/>
  <!-- Smile -->
  <path d="M170 170 Q180 180 190 170" stroke="#2D2D2D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="155" cy="165" rx="8" ry="5" fill="#FFB6B6" opacity="0.4"/>
  <ellipse cx="205" cy="165" rx="8" ry="5" fill="#FFB6B6" opacity="0.4"/>
  
  <!-- Social Media Icons floating -->
  <!-- WhatsApp -->
  <circle cx="80" cy="140" r="22" fill="#25D366"/>
  <text x="80" y="147" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="Arial">W</text>
  
  <!-- Facebook -->
  <circle cx="60" cy="210" r="22" fill="#1877F2"/>
  <text x="60" y="217" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="Arial">f</text>
  
  <!-- Instagram -->
  <circle cx="300" cy="120" r="22" fill="#E4405F"/>
  <rect x="286" y="106" width="28" height="28" rx="8" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="300" cy="120" r="8" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="312" cy="108" r="2" fill="white"/>
  
  <!-- LinkedIn -->
  <circle cx="320" cy="190" r="22" fill="#0077B5"/>
  <text x="320" y="198" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="Arial">in</text>
  
  <!-- Globe/Internet icon -->
  <circle cx="330" cy="270" r="28" fill="#FFB627"/>
  <circle cx="330" cy="270" r="20" fill="none" stroke="white" stroke-width="2"/>
  <ellipse cx="330" cy="270" rx="10" ry="20" fill="none" stroke="white" stroke-width="1.5"/>
  <line x1="310" y1="270" x2="350" y2="270" stroke="white" stroke-width="1.5"/>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="300" r="6" fill="#E85D04" opacity="0.5"/>
  <circle cx="350" cy="320" r="8" fill="#E85D04" opacity="0.4"/>
  <rect x="340" y="80" width="30" height="30" rx="6" fill="#FFB627" opacity="0.3" transform="rotate(15 355 95)"/>
  <circle cx="70" cy="80" r="4" fill="#E85D04" opacity="0.3"/>
</svg>